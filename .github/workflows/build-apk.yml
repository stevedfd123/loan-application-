name: Build APK

# Builds the Android APK from the published web app (index.html) and attaches
# it to the workflow run as a downloadable artifact.
on:
  push:
    branches:
      - '**'
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to build'
        required: true
        default: 'arena/d36f5699-loan-application'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure a debug keystore exists (used to sign the release build)
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-out/loan-app-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk apk-out/loan-app-release.apk
          ls -la apk-out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loan-app-apk
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### APK build finished";
            echo "";
            echo "Download from the **Artifacts** section of this run:";
            echo "";
            echo "- \`loan-app-release.apk\` - installable release build";
            echo "- \`loan-app-debug.apk\` - debug build";
          } >> "$GITHUB_STEP_SUMMARY"
