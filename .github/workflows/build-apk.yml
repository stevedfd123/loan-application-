name: Build APK

# Builds the Android APK from the published web app (index.html), attaches it to
# the workflow run as an artifact, and publishes it as a GitHub Release so there
# is a stable public download link:
#
#   https://github.com/stevedfd123/loan-application-/releases/download/apk-latest/loan-app-release.apk
on:
  push:
    branches:
      - '**'
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure a debug keystore exists (used to sign the release build)
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p apk-out dist
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-out/loan-app-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk apk-out/loan-app-release.apk
          cp apk-out/loan-app-release.apk dist/loan-app-release.apk
          cp apk-out/loan-app-debug.apk dist/loan-app-debug.apk
          ls -la apk-out

      # Guard against the WebView shell shipping without the web app inside it.
      - name: Verify web assets are inside the APK
        run: |
          set -euo pipefail
          listing="$(unzip -l apk-out/loan-app-release.apk || true)"
          echo "$listing"
          if ! echo "$listing" | grep -q 'assets/www/index.html'; then
            echo "::error::assets/www/index.html is missing from the APK - the syncWebApp Gradle task did not run"
            exit 1
          fi
          if [ "$(echo "$listing" | awk '/assets\/www\/index.html/{print $1}')" -lt 40000 ]; then
            echo "::error::assets/www/index.html looks truncated"
            exit 1
          fi
          echo "OK: the web app is packaged inside the APK"

      - name: Commit APKs back to the branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/loan-app-release.apk dist/loan-app-debug.apk
          if git diff --cached --quiet; then
            echo "APKs unchanged, nothing to commit"
          else
            git commit -m "chore: APK build ${{ github.sha }} [skip ci]"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loan-app-apk
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 30

      # Keep one rolling release so the download URL never changes.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          cat > /tmp/notes.md <<'EOF'
          Built from branch `BRANCH` @ `SHA`.

          - `loan-app-release.apk` — installable release build
          - `loan-app-debug.apk` — debug build

          Install: copy the APK to the phone, tap it, then allow
          "install unknown apps".
          EOF
          sed -i "s|BRANCH|$BRANCH|; s|SHA|$SHA|" /tmp/notes.md

          # Remove the previous rolling release (and its tag) so the URL always
          # points at the newest build.
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest \
            --target "$BRANCH" \
            --title "Loan App APK" \
            --notes-file /tmp/notes.md \
            apk-out/loan-app-release.apk \
            apk-out/loan-app-debug.apk

      - name: Summary
        run: |
          {
            echo "### APK build finished";
            echo "";
            echo "**Download (permanent link):**";
            echo "";
            echo "https://github.com/stevedfd123/loan-application-/releases/download/apk-latest/loan-app-release.apk";
            echo "";
            echo "Also attached to this run as the \`loan-app-apk\` artifact.";
          } >> "$GITHUB_STEP_SUMMARY"
